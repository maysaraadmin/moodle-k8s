apiVersion: v1
kind: LimitRange
metadata:
  name: moodle-limits
  namespace: moodle
spec:
  limits:
  - type: Container
    default:
      cpu: "100m"
      memory: "128Mi"
    defaultRequest:
      cpu: "50m"
      memory: "64Mi"
    max:
      cpu: "2"
      memory: 4Gi
    min:
      cpu: "10m"
      memory: "32Mi"
