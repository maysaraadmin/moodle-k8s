apiVersion: batch/v1
kind: CronJob
metadata:
  name: moodle-cron
  namespace: moodle
spec:
  schedule: "*/1 * * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: moodle
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
          terminationGracePeriodSeconds: 30
          restartPolicy: OnFailure
          backoffLimit: 3
          containers:
          - name: cron
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            image: docker.io/library/moodle-php-apache:8.3.7
            imagePullPolicy: IfNotPresent
            envFrom:
            - configMapRef:
                name: moodle-config
            env:
            - name: MOODLE_DOCKER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: db-password
            - name: MOODLE_DOCKER_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: admin-password
            - name: MOODLE_DOCKER_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: moodle-secrets
                  key: redis-password
            command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              if [ -f /var/www/html/admin/cli/cron.php ]; then
                php /var/www/html/admin/cli/cron.php
              else
                echo "Moodle source code not found. Mount Moodle code to /var/www/html to enable cron."
                exit 0
              fi
            volumeMounts:
            - name: moodledata
              mountPath: /var/www/moodledata
            - name: tmp
              mountPath: /tmp
            - name: php-conf
              mountPath: /usr/local/etc/php/conf.d
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
          volumes:
          - name: moodledata
            persistentVolumeClaim:
              claimName: moodledata-pvc
          - name: tmp
            emptyDir:
              medium: Memory
          - name: php-conf
            emptyDir: {}
