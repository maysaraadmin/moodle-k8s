apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: moodle
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 70
      containers:
      - name: pgbouncer
        securityContext:
          runAsNonRoot: true
          runAsUser: 70
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        image: pgbouncer/pgbouncer:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASES_USER
          value: moodleuser
        - name: DATABASES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: moodle-secrets
              key: db-password
        - name: DATABASES_HOST
          value: postgres
        - name: DATABASES_PORT
          value: "5432"
        - name: DATABASES_DBNAME
          value: moodle
        - name: PGBOUNCER_LISTEN_PORT
          value: "5432"
        - name: PGBOUNCER_POOL_MODE
          value: transaction
        - name: PGBOUNCER_MAX_CLIENT_CONN
          value: "1000"
        - name: PGBOUNCER_DEFAULT_POOL_SIZE
          value: "20"
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: log
          mountPath: /var/log/pgbouncer
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: log
        emptyDir: {}
