apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: moodle
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
    spec:
      serviceAccountName: pgbouncer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
      initContainers:
      - name: init-pgbouncer
        image: busybox:1.36
        command: ["sh", "-c"]
        args:
        - |
          PASSWORD=$(cat /secrets/db-password)
          HASH=$(printf '%s' "$PASSWORD" | md5sum | cut -d' ' -f1)
          printf '"%s" "%s"\n' "moodleuser" "$HASH" > /pgbouncer/userlist.txt
        securityContext:
          runAsNonRoot: true
          runAsUser: 65534
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: pgbouncer-data
          mountPath: /pgbouncer
        - name: secrets
          mountPath: /secrets
          readOnly: true
      containers:
      - name: pgbouncer
        securityContext:
          runAsNonRoot: true
          runAsUser: 70
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        image: pgbouncer/pgbouncer:1.22.0
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: moodle-secrets
              key: db-password
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: log
          mountPath: /var/log/pgbouncer
        - name: pgbouncer-data
          mountPath: /etc/pgbouncer
        - name: pgbouncer-config
          mountPath: /etc/pgbouncer/pgbouncer.ini
          subPath: pgbouncer.ini
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: log
        emptyDir: {}
      - name: pgbouncer-data
        emptyDir: {}
      - name: pgbouncer-config
        configMap:
          name: pgbouncer-config
      - name: secrets
        secret:
          secretName: moodle-secrets
