resources:
  - ../../base

namespace: moodle-dev

commonLabels:
  environment: dev

patches:
- target:
    kind: ConfigMap
    name: moodle-config
  patch: |-
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: moodle-config
    data:
      MOODLE_DOCKER_ADMIN_EMAIL: admin-dev@example.com
      MOODLE_DOCKER_WWWROOT: https://moodle-dev.example.com
- target:
    kind: Deployment
    name: moodle
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "256Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "250m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "512Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "500m"
- target:
    kind: Deployment
    name: postgres
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "128Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "100m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "256Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "250m"
- target:
    kind: Ingress
    name: moodle-ingress
  patch: |-
    - op: replace
      path: /spec/tls/0/hosts/0
      value: moodle-dev.example.com
    - op: replace
      path: /spec/rules/0/host
      value: moodle-dev.example.com
